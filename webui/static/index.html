<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Astrbot Media Portal · 多媒体管理控制台" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B1120" />
    <title>Media Portal · 多媒体管理控制台</title>

    <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
    <link rel="alternate icon" type="image/png" href="/static/logo.png" />
    <link rel="apple-touch-icon" href="/static/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/vendor/vue.global.prod.js"></script>
    <script src="/static/vendor/lucide.min.js"></script>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("media_portal_theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          } else {
            var prefersDark =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.setAttribute("data-theme", prefersDark ? "dark" : "light");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div class="app-backdrop" aria-hidden="true">
      <span class="blob blob-a"></span>
      <span class="blob blob-b"></span>
      <span class="blob blob-c"></span>
    </div>
    <div id="app"></div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
